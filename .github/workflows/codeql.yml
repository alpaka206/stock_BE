name: codeql

on:
  pull_request:
  push:
    branches:
      - develop
      - main
  schedule:
    - cron: "23 19 * * 0"

permissions:
  security-events: write
  packages: read
  actions: read
  contents: read

jobs:
  analyze:
    name: codeql
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
